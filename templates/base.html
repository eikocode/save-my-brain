<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ledger{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #ddd; font-family: system-ui, sans-serif; font-size: 15px; }
    a { color: #64c8a0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { background: #161616; border-bottom: 1px solid #222; padding: 0.75rem 2rem;
          display: flex; align-items: center; gap: 2rem; }
    nav .brand { font-weight: 700; color: #64c8a0; font-size: 1.1rem; }
    main { padding: 2rem; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #eee; }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #aaa; }
    .card { background: #161616; border: 1px solid #222; border-radius: 8px;
            padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .num { font-size: 1.3rem; font-weight: 600; }
    .income { color: #5dc870; }
    .expense { color: #e05c5c; }
    .neutral { color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th { background: #1a1a1a; color: #64c8a0; padding: 0.5rem 0.75rem;
         text-align: left; font-size: 0.85rem; letter-spacing: 0.05em; }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e1e1e; font-size: 0.9rem; }
    tr:hover td { background: #181818; }
    form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    select, input[type=text], input[type=month], input[type=file] {
      background: #1e1e1e; color: #ddd; border: 1px solid #333; padding: 0.4rem 0.7rem;
      border-radius: 4px; font-size: 0.9rem; }
    .btn { background: #64c8a0; color: #111; border: none; padding: 0.45rem 1.2rem;
           border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn:hover { background: #7dd9b1; }
    .btn-outline { background: transparent; color: #64c8a0; border: 1px solid #64c8a0; }
    .msg { background: #1e2a1e; border: 1px solid #3a5a3a; color: #7dd9b1;
           padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .msg.warn { background: #2a1e1e; border-color: #5a3a3a; color: #e09090; }
    .tag { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px;
           font-size: 0.78rem; font-weight: 600; }
    .tag-income { background: #1a3a1a; color: #5dc870; }
    .tag-expense { background: #3a1a1a; color: #e05c5c; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Ledger</span>
    <a href="/">Dashboard</a>
    <a href="/transactions">Transactions</a>
    <a href="/upload">Upload</a>
    <a href="/export">Export</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
